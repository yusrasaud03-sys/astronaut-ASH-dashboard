
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronaut Smart Health Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="app">
  <!-- سايدبار-->
  <div class="sidebar">
    <div class="nav" onclick="showPage('home')">
      <img src="https://img.icons8.com/fluency/48/home.png">
      <span>Home</span>
    </div>
    <div class="nav" onclick="showPage('sensors')">
      <img src="https://img.icons8.com/fluency/48/sensor.png">
      <span>Sensors</span>
    </div>
    <div class="nav" onclick="showPage('ai')">
      <img src="https://img.icons8.com/fluency/48/artificial-intelligence.png">
      <span>AI</span>
    </div>
    <div class="nav" onclick="showPage('alerts')">
      <img src="https://img.icons8.com/fluency/48/error.png">
      <span>Alerts</span>
    </div>
    <div class="nav" onclick="showPage('profile')">
      <img src="https://img.icons8.com/fluency/48/user-male-circle.png">
      <span>Profile</span>
    </div>
    <div class="nav" onclick="showPage('data')">
      <img src="https://img.icons8.com/fluency/48/database.png">
      <span>Data</span>
    </div>
    <div class="nav" onclick="showPage('env')">
      <img src="https://img.icons8.com/fluency/48/temperature.png">
      <span>Environment</span>
    </div>
    <div class="nav" onclick="showPage('vr')">
      <img src="https://img.icons8.com/fluency/48/virtual-reality.png">
      <span>VR</span>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content"></div>
</div>

<script src="script.js"></script>
</body>
</html>
